# Translation configuration for `third_party/libsignal/libsignal-session/cli/rt` (C2 `lib2` sibling).
#
# Consumed only by the stock builder (`scripts/cli-elf-stock` -> `work/lib2_*.o`), never registered
# in `lakefile.lean` so `libsignalSessionObj` / `libsignalSessionExterns` remain byte-identical.
# Trims all 40 C2 + Stage-A + Stage-B Rust/crate runtime hook & callback bodies (`memrchr`,
# `from_utf8`, `SystemTime::duration_since`, `SystemTime::add`, `subtle::black_box::<u8>`,
# `curve25519_dalek` / `x25519_dalek` points/scalars/X25519, `libcrux_ml_kem` ML-KEM-768 /
# ML-KEM-1024, `sha2::sha256::compress256`, `sha2::sha512::compress512`, `libcrux_hmac::hmac`,
# `signal_crypto::aes_cbc::aes_256_cbc_{encrypt,decrypt}`,
# `core::fmt::*`, and `alloc::fmt::format::format_inner`) plus their internal callees
# (including `cpufeatures::aarch64::getauxval_hwcap` and `aes::armv8::*`) from the
# `aarch64-unknown-linux-gnu` sysroot rlibs (`core`, `alloc`, `std`) and the `deps/` rlibs
# (`curve25519_dalek`, `x25519_dalek`, `libcrux_ml_kem`, `sha2`, `libcrux_sha2`, `libcrux_hmac`,
# `aes`, `signal_crypto`, `cpufeatures`) of the same cargo build that produced `lib0_*.o`.
#
# Note: `core_memrchr` and `core_from_utf8` are two separate `[[sysroot_objects]]` entries (as in
# `STOCK-PLAN` `part1_roots.md` §1 and `RENAME`'s `a819d0d7` trial) because in `core` `cgu.0`
# `from_utf8` sits at an earlier ELF section index than `memrchr`, and separate `.o` trims allow
# independent per-row inclusion while keeping `memrchr` before `from_utf8`. `core::fmt::*` shares
# `.rodata.str1.1` string literals with `core_memrchr` in `core` `cgu.0` and is grouped into `order = 0`.

crate_dir = "../.."
crates = []
obj_name = "libsignalCliRt"
obj_file = "GeneratedLean/LibsignalCliRtObj.lean"
namespace_prefix = "CryptoVerification"
page_separate_data = true
legacy_linked_image = false
hashed_inputs = [
    "cli/rt/translation.toml",
    "Cargo.toml",
    "Cargo.lock",
]
rustflags = ["--cfg", 'sha2_backend="soft"']
license_header = [
    "Machine code trimmed from Rust `core`/`alloc`/`std` sysroot and `curve25519-dalek` /",
    "`x25519-dalek` / `libcrux-ml-kem` / `sha2` / `libcrux-sha2` / `libcrux-hmac` / `aes` /",
    "`signal-crypto` / `cpufeatures` crate dependencies compiled with `third_party/libsignal/libsignal-session/Cargo.lock`.",
    "",
    "See `third_party/libsignal/README.md`.",
]

[upstream]
name = "libsignal"
repo_url = "https://github.com/signalapp/libsignal"
tag = "v0.105.4"
vendor_symlink = "vendor/libsignal"
probe_path = "rust/protocol/Cargo.toml"
env_var = "LIBSIGNAL_SRC"
no_clone_env_var = "LIBSIGNAL_NO_CLONE"
home_subdir = "sw/libsignal"

[placed]
multi = true
# Ordered with Stage A's 19 non-tail rows first (`0..18`), Stage B + `getauxval_hwcap` next (`19..38`),
# and `SystemTime::add` LAST (`39`) so its retired stub (`__retired_39`) and `lib2_13.o` sections
# sit strictly at the tail of `.text.lib2` and `.rodata.lib2`: holding `time_add` back truncates
# only the two tails without shifting any other `lib2` code/RO address or renumbering `__retired_0..38`.
