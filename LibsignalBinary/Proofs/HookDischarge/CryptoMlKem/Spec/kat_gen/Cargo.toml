[package]
name = "mlkem-kat-gen"
version = "0.1.0"
edition = "2021"
publish = false
# Standalone differential KAT generator for `LibsignalBinary/Proofs/HookDischarge/CryptoMlKem/Spec/MlKemKat.lean`.
# Isolated `[workspace]` with its own `Cargo.lock` (pinned to `libcrux-ml-kem = "=0.0.10"`, matching
# `third_party/libsignal/libsignal-session/Cargo.lock`); never participates in the session binary build.

[workspace]

[dependencies]
libcrux-ml-kem = { version = "=0.0.10", default-features = false, features = ["mlkem768", "mlkem1024", "kyber", "incremental"] }
libcrux-sha3 = { version = "=0.0.10", default-features = false }
