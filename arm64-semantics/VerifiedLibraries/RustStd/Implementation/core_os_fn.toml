# Translation configuration for unmodified Rust 1.98.1 `core::io::error::os_functions`
# (`get_os_functions`, `set_functions_inner`, and `.data` `OS_FUNCTIONS`) from the pinned
# `aarch64-unknown-linux-musl` sysroot (`libcore-89491010f55f6617.rlib`,
# SHA-256 3397f27434f891334ee2e29352a2fbab8de590e93b496379ee8bc1ab4b17cca9).
#
# Exported as a separate `Obj.MultiPlacedLib` (`rustCoreOsFnMultiLib`) from `rustStdIoMultiLib`
# because `libcore` accesses `OS_FUNCTIONS` via an adjacent relaxable GOT pair (`gotPairAt = true`)
# whereas `libstd` accesses `OS_FUNCTIONS` via non-adjacent GOT pairs (`gotPairAt = false`,
# requiring an external GOT slot).

obj_name = "rustCoreOsFn"
namespace_prefix = "VerifiedLibraries.RustStd"
obj_file = "RustStd/Generated/RustCoreOsFnObj.lean"
title = "Rust 1.98.1 `core::io::error::os_functions` (`aarch64-unknown-linux-musl` prebuilt `libcore.rlib`)"
hashed_inputs = [
    "build.sh",
]
license_header = [
    "Copyright (c) The Rust Project Contributors.",
    "Licensed under the Apache License, Version 2.0 or the MIT license (Rust 1.98.1 aarch64-unknown-linux-musl sysroot).",
]

build_script = "build.sh"
c_objects = ["build/rust_core_os_fn.o"]

[placed]
placed_only = true
multi = true
exports = [
    "core::io::error::os_functions::get_os_functions",
    "core::io::error::os_functions::set_functions::set_functions_inner",
]
