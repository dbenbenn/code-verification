[package]
name = "snapshot-link"
version = "0.1.0"
edition = "2024"
publish = false

# Untrusted link recipes for whole-binary ELF fixtures: links extracted `translation.toml`
# objects with stock `ld.lld` (`--stock`, emitting `stock-link.json` and `census.json`) or builds
# pinned Rust 1.98.1 `std` static AArch64 Linux executables (`--main-rust`).

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
object = { version = "0.36", features = ["write"] }
rust-obj2lean = { path = "../rust-obj2lean" }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
which = "7"

[dev-dependencies]
object = { version = "0.36", features = ["write"] }

